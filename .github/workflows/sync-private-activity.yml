name: Sync 48h Private Repo Pulse

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest private repo pushed in last 48h (Name + Timestamp only)
        env:
          GH_PAT: ${{ secrets.GH_ACTIVITY_TOKEN_Portfolio }}
        run: |
          node -e '
            const https = require("https");
            const fs = require("fs");
            const token = process.env.GH_PAT;
            if (!token) {
              fs.writeFileSync("gh-activity.json", JSON.stringify({ private_repos: [] }, null, 2));
              process.exit(0);
            }

            const options = {
              hostname: "api.github.com",
              path: "/user/repos?visibility=private&affiliation=owner&sort=pushed&direction=desc&per_page=10",
              headers: {
                "User-Agent": "adarshgandla",
                "Authorization": `Bearer ${token}`,
                "Accept": "application/vnd.github+json"
              }
            };

            https.get(options, (res) => {
              let body = "";
              res.on("data", chunk => body += chunk);
              res.on("end", () => {
                try {
                  const repos = JSON.parse(body);
                  const twoDaysMs = 48 * 60 * 60 * 1000;
                  const recentPrivate = Array.isArray(repos)
                    ? repos
                        .filter(r => r.private && (Date.now() - new Date(r.pushed_at).getTime()) <= twoDaysMs)
                        .slice(0, 1) // Only the single latest private repo from the last 48 hours
                        .map(r => ({ name: r.name, pushed_at: r.pushed_at }))
                    : [];
                  fs.writeFileSync("gh-activity.json", JSON.stringify({ private_repos: recentPrivate }, null, 2));
                } catch (e) {
                  fs.writeFileSync("gh-activity.json", JSON.stringify({ private_repos: [] }, null, 2));
                }
              });
            });
          '

      - name: Force-push single commit to orphan activity-data branch (Zero History)
        run: |
          git checkout --orphan temp-activity-branch
          git rm -rf --cached .
          git add -f gh-activity.json
          git config user.name "adarshgandla"
          git config user.email "adarshgandla@users.noreply.github.com"
          git commit -m "chore: overwrite 48h activity pulse (zero history)"
          git push origin temp-activity-branch:activity-data --force
